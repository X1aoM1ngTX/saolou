<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>扫楼打分本 · 租房实时评分对比</title>
<link rel="icon" type="image/svg+xml" href="saolou.svg">
<link rel="apple-touch-icon" href="saolou.svg">
<link rel="mask-icon" href="saolou.svg" color="#1a7f37">
<style>
  :root{
    --canvas:#ffffff; --subtle:#f6f8fa;
    --fg:#1f2328; --muted:#59636e; --faint:#818b98;
    --border:#d1d9e0; --border-muted:#eaeef2;
    --accent:#0969da; --accent-sub:#ddf4ff;
    --success:#1a7f37; --success-em:#1f883d; --success-sub:#dafbe1; --success-deep:#116329;
    --attention:#9a6700; --attention-sub:#fff8c5;
    --danger:#cf222e; --danger-sub:#ffebe9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --shadow:0 1px 0 rgba(31,35,40,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,"Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;overflow-x:hidden;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--fg);}
  .app{max-width:920px;margin:0 auto;padding:0 14px 90px;}

  /* ===== 全局导航（深色条） ===== */
  .gh-top{
    position:sticky;top:0;z-index:30;background:#24292f;color:#fff;
    margin:0 calc(50% - 50vw);padding:10px calc(50vw - 50% + 14px);
  }
  .gh-top-in{max-width:892px;margin:0 auto;display:flex;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .brand svg{flex:0 0 auto;color:#fff;opacity:.92;}
  .brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .edit-title{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ===== 按钮（Primer） ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--border);border-radius:6px;background:var(--subtle);color:var(--fg);
    padding:0 14px;min-height:40px;font-size:14px;font-weight:500;
    transition:background-color .15s,border-color .15s;white-space:nowrap;
  }
  .btn:hover{background:#eef1f4;}
  .btn:active{background:#e6eaef;}
  .btn-primary{background:var(--success-em);border-color:rgba(31,35,40,.15);color:#fff;}
  .btn-primary:hover{background:var(--success);border-color:rgba(31,35,40,.15);}
  .btn-primary:active{background:#176f31;}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:var(--danger-sub);border-color:rgba(207,34,46,.4);}
  .btn-dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff;}
  .btn-dark:hover{background:rgba(255,255,255,.2);}
  .btn-sm{min-height:36px;padding:0 11px;font-size:12.5px;}
  .btn.block{width:100%;}
  .btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{
    outline:none;box-shadow:0 0 0 3px rgba(9,105,218,.35);
  }

  /* ===== Box 组件 ===== */
  .box{background:var(--canvas);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);}
  .box-head{
    display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--subtle);
    border-bottom:1px solid var(--border);font-size:13px;font-weight:600;border-radius:6px 6px 0 0;
  }
  .box-head .hint{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--faint);text-align:right;}
  .box-body{padding:14px;}
  .box-foot{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:10px 14px;border-top:1px solid var(--border-muted);border-radius:0 0 6px 6px;
  }

  /* ===== Label / Counter ===== */
  .label{
    display:inline-flex;align-items:center;padding:0 8px;height:20px;
    font-size:11px;font-weight:500;line-height:1;border-radius:1em;white-space:nowrap;
  }
  .lb-success{background:var(--success-sub);color:var(--success-deep);}
  .lb-accent{background:var(--accent-sub);color:var(--accent);}
  .lb-attention{background:var(--attention-sub);color:var(--attention);}
  .lb-danger{background:var(--danger-sub);color:var(--danger);}
  .lb-demo{background:rgba(175,184,193,.32);color:var(--muted);}
  .demo-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--accent-sub);border:1px solid rgba(9,105,218,.28);
    border-radius:6px;padding:11px 14px;margin-bottom:13px;font-size:12.8px;color:var(--fg);
  }
  .demo-bar .t{flex:1;min-width:210px;line-height:1.7;}
  .demo-bar .t b{color:var(--accent);}
  .counter{
    display:inline-flex;align-items:center;padding:0 9px;height:20px;
    font-size:11px;font-weight:600;line-height:1;border-radius:1em;
    background:rgba(175,184,193,.25);color:var(--fg);font-family:var(--mono);letter-spacing:.5px;
  }

  /* ===== 列表视图 ===== */
  .repo-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .stats{display:flex;margin-bottom:13px;}
  .stat{flex:1;min-width:0;padding:12px 16px;}
  .stat + .stat{border-left:1px solid var(--border-muted);}
  .stat .n{font-size:22px;font-weight:700;line-height:1.1;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:3px;}

  details.rules{margin-bottom:13px;}
  details.rules summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);border-radius:6px;
  }
  details.rules summary::-webkit-details-marker{display:none;}
  details.rules summary .chev{color:var(--faint);transition:transform .15s;flex:0 0 auto;}
  details.rules[open] summary .chev{transform:rotate(180deg);}
  details.rules[open] summary{border-bottom:1px solid var(--border-muted);border-radius:6px 6px 0 0;}
  details.rules .rb{padding:12px 16px;font-size:12.8px;color:var(--muted);line-height:1.9;}
  details.rules .rb b{color:var(--fg);}
  .set-block{margin-bottom:14px;}
  .set-label{font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--fg);}
  .set-hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.6;}
  .set-num{
    width:120px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;
    background:var(--subtle);min-height:38px;outline:none;font-size:14px;
  }
  .set-num:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.3);outline:none;}
  .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;}
  .set-item{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);}
  .set-item input{
    width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;
    background:var(--subtle);min-height:36px;outline:none;font-size:13px;
  }
  .set-item input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.3);outline:none;}
  .set-presets{display:flex;flex-wrap:wrap;gap:8px;}

  /* ===== 地图 ===== */
  .map-box{height:230px;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--subtle);}
  .map-box.big{height:min(62vh,520px);}
  .map-loading{
    height:100%;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;color:var(--faint);text-align:center;padding:0 20px;line-height:1.7;
  }
  .map-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .map-tip{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.7;}
  .mk{
    width:26px;height:26px;border-radius:50%;background:var(--success-em);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:var(--mono);
  }
  .mk.company{background:var(--accent);font-size:13px;}
  .mk.pick{background:var(--danger);}
  .amap-info-content{padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--fg);}
  .amap-info-content b{font-size:13.5px;}
  .amap-info-content .r{color:var(--muted);}
  .viewtabs{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;}
  .viewtabs button{
    border:none;background:#fff;color:var(--muted);font-size:12.5px;padding:0 14px;min-height:34px;font-weight:500;
  }
  .viewtabs button + button{border-left:1px solid var(--border);}
  .viewtabs button.on{background:var(--fg);color:#fff;}

  .flat{margin-bottom:12px;}
  .flat.best{border-color:var(--success);}
  .flat.best .box-head{border-radius:5px 5px 0 0;}
  .flat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .flat-head .score{font-size:20px;font-weight:700;}
  .flat-head .score .of{font-size:11.5px;color:var(--faint);font-weight:400;margin-left:1px;}
  .flat-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15.5px;font-weight:600;line-height:1.4;}
  .flat-name{cursor:pointer;display:inline-flex;align-items:baseline;gap:4px;min-width:0;}
  .flat-name .pen{color:var(--faint);flex:0 0 auto;transform:translateY(1px);}
  .flat-name:hover{color:var(--accent);}
  .meta{font-size:12.5px;color:var(--muted);margin-top:5px;word-break:break-all;}

  /* ===== 照片 ===== */
  .photo-strip{display:flex;gap:6px;overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch;}
  .photo-strip:empty{display:none;}
  .photo-strip img{
    width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border);
    flex:0 0 auto;cursor:pointer;background:var(--subtle);
  }
  .photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;}
  .ph{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--subtle);}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .ph-del{
    position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;
    background:rgba(31,35,40,.75);color:#fff;font-size:12px;line-height:1;cursor:pointer;
  }
  .ph-add{
    border:1.5px dashed var(--border);background:var(--subtle);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:12px;
  }
  .ph-add:hover{background:#eef1f4;}
  .ph-add .plus{font-size:22px;line-height:1;color:var(--faint);}
  .lightbox{
    position:fixed;inset:0;background:rgba(1,4,9,.93);z-index:100;display:none;
    align-items:center;justify-content:center;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:94vw;max-height:80vh;border-radius:6px;}
  .lb-close{
    position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer;
  }
  .lb-bar{
    position:absolute;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;
    gap:20px;color:#fff;font-size:13px;
  }
  .lb-bar button{
    width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
    color:#fff;font-size:22px;line-height:1;cursor:pointer;
  }
  .lb-bar button:active{background:rgba(255,255,255,.28);}

  /* 得分构成条（语言条式） */
  .segbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(175,184,193,.3);margin-top:13px;}
  .segbar span{display:block;height:100%;}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0;}
  .lg .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .lg .val{margin-left:auto;font-size:12px;color:var(--fg);}
  .lg .val em{font-style:normal;color:var(--faint);}

  .warns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .cost{font-size:13px;font-weight:700;}
  .cost.in{color:var(--success);} .cost.over{color:var(--danger);}
  .cost2{font-size:12px;color:var(--muted);}
  .acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .status-sel{
    border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--fg);
    font-size:12.5px;min-height:36px;padding:0 8px;outline:none;cursor:pointer;
  }
  .status-sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.3);}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px;}
  .filters .chip{min-height:34px;padding:0 12px;font-size:12.5px;background:#fff;}
  .filters .chip.on{background:var(--fg);border-color:var(--fg);color:#fff;font-weight:500;}
  .filters .chip span{opacity:.7;}

  .blankslate{padding:44px 24px;text-align:center;}
  .blankslate h3{margin:12px 0 6px;font-size:16px;font-weight:600;}
  .blankslate p{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.7;}
  .foot{margin:28px 0 6px;text-align:center;font-size:12px;color:var(--faint);line-height:1.8;}

  /* ===== 编辑视图 ===== */
  .edit-grid{display:flex;gap:14px;align-items:flex-start;}
  .edit-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px;}
  .live-panel{flex:0 0 300px;position:sticky;top:72px;display:flex;flex-direction:column;gap:12px;}

  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px;font-weight:600;color:var(--fg);}
  .field input,.field select,.field textarea{
    border:1px solid var(--border);border-radius:6px;padding:8px 12px;min-height:42px;
    background:var(--subtle);width:100%;outline:none;transition:background-color .15s,border-color .15s,box-shadow .15s;
  }
  .field textarea{min-height:64px;resize:vertical;line-height:1.6;}
  .field input:focus,.field select:focus,.field textarea:focus{
    background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.3);
  }
  .with-unit{position:relative;}
  .with-unit input{padding-right:46px;}
  .with-unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);pointer-events:none;}
  .fieldnote{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.7;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--border);background:#fff;border-radius:2em;padding:0 13px;
    min-height:38px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
    user-select:none;transition:background-color .12s,border-color .12s;
  }
  .chip:hover{background:var(--subtle);}
  .chip .tick{
    width:16px;height:16px;border:1.5px solid #afb8c1;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex:0 0 auto;
  }
  .chip.on{background:var(--success-sub);border-color:var(--success);color:var(--success-deep);font-weight:500;}
  .chip.on .tick{background:var(--success);border-color:var(--success);color:#fff;}
  .chip.risk.on{background:var(--danger-sub);border-color:var(--danger);color:var(--danger);}
  .chip.risk.on .tick{background:var(--danger);border-color:var(--danger);}

  .stars{display:flex;flex-direction:column;gap:11px;}
  .star-row{display:flex;align-items:center;gap:10px;width:100%;}
  .star-row .sl{font-size:13px;color:var(--muted);flex:0 0 76px;}
  .seg{display:flex;gap:4px;flex:1;}
  .seg button{
    flex:1;min-height:40px;border:1px solid var(--border);background:var(--subtle);
    border-radius:6px;font-size:13px;color:var(--muted);transition:background-color .12s;
  }
  .seg button:hover{background:#eef1f4;}
  .seg button.on{background:var(--success-em);border-color:rgba(31,35,40,.15);color:#fff;font-weight:700;}

  /* 实时侧栏 */
  .score-box{text-align:center;padding:16px;}
  .score-line{display:flex;align-items:baseline;justify-content:center;gap:6px;}
  .score-line .n{font-size:46px;font-weight:700;line-height:1;}
  .score-line .of{font-size:14px;color:var(--muted);}
  .score-box .g{margin-top:9px;}
  .progress{height:8px;background:rgba(175,184,193,.3);border-radius:6px;overflow:hidden;margin-top:13px;}
  .progress span{display:block;height:100%;border-radius:6px;transition:width .25s;}

  .costrows .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;color:var(--muted);}
  .costrows .row .v{color:var(--fg);font-weight:600;text-align:right;}
  .costrows .row.total{border-top:1px dashed var(--border);margin-top:6px;padding-top:10px;font-size:14px;}
  .costrows .row.total .v{font-size:18px;font-weight:700;}
  .flash{margin-top:10px;border-radius:6px;padding:8px 12px;font-size:12.5px;font-weight:500;}
  .flash.in{background:var(--success-sub);color:var(--success-deep);}
  .flash.over{background:var(--danger-sub);color:var(--danger);}

  .riskline{margin-top:10px;font-size:12px;font-weight:700;color:var(--danger);}
  .live-warn{display:flex;flex-wrap:wrap;gap:6px;}
  .muted2{color:var(--faint);font-size:12.5px;}
  .save-bar{display:flex;gap:9px;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
    background:#24292f;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86vw;
    box-shadow:0 8px 24px rgba(31,35,40,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
  /* ===== 移动端 ===== */
  @media (max-width:760px){
    .app{padding:0 11px 96px;}
    .gh-top{padding:9px calc(50vw - 50% + 11px);}
    .edit-grid{flex-direction:column;}
    .live-panel{flex:1 1 auto;width:100%;position:static;order:-1;}
    .stat{padding:11px 12px;}
    .stat .n{font-size:20px;}
    .acts{margin-left:0;width:100%;}
    .acts .btn{flex:1;}
    .legend{gap:5px 12px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <img id="lbImg" alt="照片查看">
  <div class="lb-bar"><button id="lbPrev" aria-label="上一张">‹</button><span id="lbCount" class="mono"></span><button id="lbNext" aria-label="下一张">›</button></div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 数据字典 ================= */
  var FEATURES = [
    ["ac","空调"],["ac1","一级能效"],["heater","热水器"],["bed","床/床垫"],["wardrobe","衣柜"],
    ["desk","桌椅"],["fridge","冰箱"],["washer","洗衣机"],["cook","可做饭"],["bath","独立卫浴"],
    ["balcony","阳台"],["light","采光好"],["vent","通风对流"],["water","水压足"],["signal","信号好"],
    ["wifi","有WiFi"],["noseep","无渗水霉斑"],["socket","插座够用"],["lock","门锁/监控"]
  ];
  var RISKS = [
    ["sublandlord","二房东/公寓公司"],["dark","握手楼暗间"],["topfloor","顶楼西晒"],["groundfloor","一楼潮湿"]
  ];
  var SUBJECTS = [["value","性价比"],["light","采光通风"],["quiet","安静安全"],["owner","房东靠谱"]];

  /* ================= 算分（规则透明，见页面说明） ================= */
  function calc(f){
    var rent = Number(f.rent)||0, ep = Number(f.ePrice)||0, wp = Number(f.wPrice)||0;
    var commute = Number(f.commuteMin)||0;
    // 各项先在默认满分（25/10/10/25/30）下算原始分，再按用户权重缩放；权重合计恒为 100，总分仍为百分制
    var W = state.settings.weights;
    // 1) 租金：450 及以下满分，1000 及以上≈5
    var rentRaw = rent<=0 ? 0 : Math.max(5, Math.min(25, 25 - Math.max(0,rent-450)/550*20));
    // 2) 通勤：按方式给满分时间（骑车10/步行·电动车15/开车20/公交地铁30），超时按比例降，保底3；未填按6中性
    var cmT = CMODE_T[f.commuteMode] || 10;
    var commuteRaw = commute<=0 ? 6 : Math.max(3, Math.min(10, 10 - Math.max(0,commute-cmT)/(2*cmT)*7));
    // 3) 水电合理度（电占70% 水占30%）
    var eS = ep<=0?6:(ep<=0.65?10:ep<=0.9?7:ep<=1.2?4:1);
    var wS = wp<=0?6:(wp<=3.5?10:wp<=5?6:2);
    // 4) 硬件齐全度  5) 主观印象
    var got = FEATURES.filter(function(x){return f.features[x[0]];}).length;
    var sv = SUBJECTS.map(function(s){return Number(f.scores[s[0]])||0;});
    var rentScore = rentRaw/25*W.rent;
    var commuteScore = commuteRaw/10*W.commute;
    var utilScore = (eS*0.7 + wS*0.3)/10*W.util;
    var featScore = got/FEATURES.length*W.feat;
    var subjScore = (sv.reduce(function(a,b){return a+b;},0)/(SUBJECTS.length*5))*W.subj;
    // 风险扣分
    var riskPenalty = (f.risks.sublandlord?8:0)+(f.risks.dark?8:0)+(f.risks.topfloor?5:0)+(f.risks.groundfloor?5:0)+(ep>=1.2?6:0);
    var score = Math.max(0, Math.round(rentScore+commuteScore+utilScore+featScore+subjScore-riskPenalty));

    var monthCost = rent + ep*(Number(f.eKwh)||0) + wp*(Number(f.wTon)||0) + (Number(f.sharedFee)||0) + (Number(f.netFee)||0);
    var warnings = [];
    if(ep>=1.2) warnings.push(["r","电费 "+ep+" 元/度，明显加价"]);
    else if(ep>0 && ep>0.65) warnings.push(["a","电费高于民用一档"]);
    if(wp>5) warnings.push(["r","水费 "+wp+" 元/吨偏高"]);
    if(f.risks.sublandlord) warnings.push(["r","二房东，需查授权"]);
    if(f.risks.dark) warnings.push(["a","暗间，白天也要开灯"]);
    if(f.risks.topfloor) warnings.push(["a","顶楼注意西晒漏水"]);
    if(f.risks.groundfloor) warnings.push(["a","一楼注意潮湿水浸"]);
    if(rent>state.settings.budget) warnings.push(["r","月租超 "+state.settings.budget+" 预算"]);
    if(!warnings.length && rent>0) warnings.push(["g","未发现明显硬伤"]);

    return {
      score:score, monthCost:Math.round(monthCost),
      parts:{rent:rentScore,commute:commuteScore,util:utilScore,feat:featScore,subj:subjScore,risk:riskPenalty},
      got:got, total:FEATURES.length, warnings:warnings, budgetOver:rent>state.settings.budget
    };
  }

  var MAXPHOTOS = 9, photoDB = null, photoURLCache = {};
  function openPhotoDB(){

  function photoPut(id, flatId, blob){
    return openPhotoDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction("pics","readwrite");
        tx.objectStore("pics").put({id:id, flatId:flatId, blob:blob, addedAt:Date.now()});
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }
  function photoGet(id){
    return openPhotoDB().then(function(db){
      return new Promise(function(res){
        var rq = db.transaction("pics").objectStore("pics").get(id);
        rq.onsuccess = function(){ res(rq.result ? rq.result.blob : null); };
        rq.onerror = function(){ res(null); };
      });
    }).catch(function(){ return null; });
  }
  function photoDel(ids){
    if(!ids || !ids.length) return Promise.resolve();
    return openPhotoDB().then(function(db){
      return new Promise(function(res){
        var tx = db.transaction("pics","readwrite");
        ids.forEach(function(id){
          tx.objectStore("pics").delete(id);
          if(photoURLCache[id]){ try{ URL.revokeObjectURL(photoURLCache[id]); }catch(e){} delete photoURLCache[id]; }
        });
        tx.oncomplete = res; tx.onerror = res;
      });
    }).catch(function(){});
  }
  function photoURL(id){
    if(photoURLCache[id]) return Promise.resolve(photoURLCache[id]);
    return photoGet(id).then(function(blob){
      if(!blob) return null;
      photoURLCache[id] = URL.createObjectURL(blob);
      return photoURLCache[id];
    });
  }
  function photoIds(f){ if(!f.photos) f.photos=[]; return f.photos; }
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        try{
          var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function(blob){
            URL.revokeObjectURL(url);
            if(blob) resolve(blob); else reject(new Error("toBlob fail"));
          }, "image/jpeg", 0.75);
        }catch(e){ URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("img load fail")); };
      img.src = url;
    });
  }

      if(!ids.length){ strip.remove(); return; }
      Promise.all(ids.map(function(id){ return photoURL(id); })).then(function(urls){

        urls.forEach(function(u,ix){

      });
    });
  }

  /* ================= 高德地图 ================= */
  var amapPromise = null;
  function loadAMap(){
    if(amapPromise) return amapPromise;
    amapPromise = new Promise(function(res, rej){
      window._AMapSecurityConfig = { securityJsCode: AMAP_SEC };
      var s = document.createElement("script");
      s.src = "https://webapi.amap.com/maps?v=2.0&key=" + AMAP_KEY;
      s.onload = function(){ window.AMap ? res(window.AMap) : rej(new Error("AMap 未就绪")); };
      s.onerror = function(){ rej(new Error("地图脚本加载失败")); };
      document.head.appendChild(s);
    }).catch(function(e){ amapPromise = null; throw e; });
    return amapPromise;
  }
  function mapFallback(box, msg){
    box.innerHTML = '<div class="map-loading">'+ (msg || "地图加载失败，可能是网络不通。<br>不影响打分和记录，可稍后重试。") +'</div>';
  }
  /* 检测 key 域名白名单问题：底图空白但标记正常时给出明确提示 */
  function checkMapDomain(box){
    setTimeout(function(){
      if(!box.isConnected) return;
      var hasTiles = box.querySelector("canvas") && box.querySelectorAll("canvas").length > 0;
      fetch("https://o4.amap.com/style/2.0.2.45/v1/pbf/1_0_s_migrate?key="+AMAP_KEY)
        .then(function(r){ return r.text(); })
        .then(function(t){
          if(t.indexOf("INVALID_USER_DOMAIN")>=0 && box.isConnected){
            var tip = document.createElement("div");
            tip.className = "map-tip";
            tip.style.cssText = "color:var(--danger);font-weight:500;margin-top:8px;";
            tip.textContent = "⚠ 高德 key 未配置域名白名单（错误码 10006），底图加载不出来。去 console.amap.com/dev/key 编辑这个 key，在「域名白名单」里填 " + location.hostname + "（本地测试填 localhost），保存后刷新。";
            box.parentNode.appendChild(tip);
          }
        }).catch(function(){});
    }, 2500);
  }
  /* 在指定容器里画一张地图：picks 可点击取点，markers 展示房/公司 */
  function drawMap(box, opts){
    opts = opts || {};
    loadAMap().then(function(AMap){
      if(!box.isConnected) return;
      box.innerHTML = "";
      var center = opts.center || (state.settings.company ? [state.settings.company.lng, state.settings.company.lat] : null);
      var map = new AMap.Map(box, {
        zoom: opts.zoom || 14,
        center: center || undefined,
        viewMode: "2D",
        resizeEnable: true
      });
      if(!center){
        map.setCity(CITY);
      }
      (opts.markers || []).forEach(function(m){
        if(m.lng==null) return;
        var mk = new AMap.Marker({
          position: [m.lng, m.lat],
          content: '<div class="mk'+(m.kind?" "+m.kind:"")+'">'+m.label+'</div>',
          offset: new AMap.Pixel(-13, -13),
          zIndex: m.zIndex || 100
        });
        map.add(mk);
        if(m.info){
          var iw = new AMap.InfoWindow({content:m.info, offset:new AMap.Pixel(0,-18)});
          mk.on("click", function(){
            iw.open(map, mk.getPosition());
            if(m.onClick) m.onClick(m, map);
          });
        }else if(m.onClick){
          mk.on("click", function(){ m.onClick(m, map); });
        }
      });
      /* 多点时自动缩放到全部点位 */
      if((opts.markers||[]).filter(function(m){return m.lng!=null;}).length > 1){
        map.setFitView(null, false, [60,60,60,60]);
      }
      if(opts.onPick){
        map.on("click", function(e){ opts.onPick(e.lnglat.getLng(), e.lnglat.getLat(), map); });
      }
      if(opts.onReady) opts.onReady(map, AMap);
      checkMapDomain(box);
    }).catch(function(){
      if(box.isConnected) mapFallback(box);
    });
  }
  /* 通勤方式 → 高德路线插件 */
  var ROUTE_PLUGIN = {"步行":"AMap.Walking","骑车":"AMap.Riding","电动车":"AMap.Riding","公交地铁":"AMap.Transfer","开车":"AMap.Driving"};
  function clearRoute(map){
    if(map && map.__routeInst){ try{ map.__routeInst.clear(); }catch(e){} map.__routeInst = null; }
  }
  /* 画导航路线并取回耗时（分钟）/距离（米） */
  function drawRoute(map, from, to, mode, cb, errCb){
    if(!map || !from || !to){ errCb("缺少位置信息"); return; }
    var plugin = ROUTE_PLUGIN[mode] || "AMap.Riding";
    loadAMap().then(function(AMap){
      AMap.plugin([plugin], function(){
        clearRoute(map);
        var inst;
        if(plugin==="AMap.Transfer"){
          inst = new AMap.Transfer({map:map, city:CITY, cityd:CITY, hideMarkers:true, autoFitView:false});
        }else if(plugin==="AMap.Driving"){
          inst = new AMap.Driving({map:map, hideMarkers:true, autoFitView:false});
        }else if(plugin==="AMap.Walking"){
          inst = new AMap.Walking({map:map, hideMarkers:true, autoFitView:false});
        }else{
          inst = new AMap.Riding({map:map, hideMarkers:true, autoFitView:false});
        }
        map.__routeInst = inst;
        inst.search([from.lng, from.lat], [to.lng, to.lat], function(status, result){
          if(status !== "complete"){ errCb("没找到"+mode+"路线，换个方式试试"); return; }
          var mins = null, dist = null;
          if(result.routes && result.routes.length){
            mins = Math.round(result.routes[0].time/60); dist = result.routes[0].distance;
          }else if(result.plans && result.plans.length){
            mins = Math.round(result.plans[0].time/60); dist = result.plans[0].distance;
          }
          if(mins==null){ errCb("这条路算不出时间，换个方式试试"); return; }
          try{ map.setFitView(); }catch(e){}
          cb(mins, dist);
        });
      });
    }).catch(function(){ errCb("地图没加载出来，请检查网络"); });
  }

  /* 浏览器定位（需 HTTPS） */
  function locateMe(cb, errCb){
    if(!navigator.geolocation){ errCb("浏览器不支持定位"); return; }
    if(location.protocol!=="https:" && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
      errCb("当前是 HTTP 访问，浏览器不允许定位；给站点配好 HTTPS 后即可，或直接点地图打点");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(p){ cb(p.coords.longitude, p.coords.latitude); },
      function(){ errCb("定位失败，可能没授权或信号弱，可直接点地图打点"); },
      {enableHighAccuracy:true, timeout:8000, maximumAge:0}
    );
  }

  /* ================= 备份 / 恢复 ================= */
  function blobToDataURL(blob){
    return new Promise(function(res, rej){
      var r = new FileReader();
      r.onload = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
      r.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(d){
    var parts = String(d).split(","), mime = (parts[0].match(/:(.*?);/)||[])[1] || "image/jpeg";
    var bin = atob(parts[1]||"");
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:mime});
  }
  function exportBackup(){
    toast("正在打包…");
    var pics = [];
    openPhotoDB().then(function(db){
      return new Promise(function(res){
        var rq = db.transaction("pics").objectStore("pics").getAll();
        rq.onsuccess = function(){ res(rq.result||[]); };
        rq.onerror = function(){ res([]); };
      });
    }).catch(function(){ return []; }).then(function(rows){
      return Promise.all(rows.map(function(r){
        return blobToDataURL(r.blob).then(function(d){
          pics.push({id:r.id, flatId:r.flatId, data:d});
        });
      }));
    }).then(function(){
      var payload = {app:"扫楼打分本", version:1, exportedAt:new Date().toISOString(), data:state, pics:pics};
      var blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      var d = new Date();
      a.download = "扫楼打分本备份-" + d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2) + ".json";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast("已导出备份（含 "+pics.length+" 张照片）");
    }).catch(function(){ toast("导出失败，请重试"); });
  }
  function importBackup(file){
    var fr = new FileReader();
    fr.onload = function(){
      var obj;
      try{ obj = JSON.parse(fr.result); }catch(e){ toast("文件格式不对，不是备份文件"); return; }
      if(!obj || !obj.data || !Array.isArray(obj.data.flats)){ toast("文件格式不对，不是备份文件"); return; }
      var n = obj.data.flats.length, pn = (obj.pics||[]).length;
      if(!confirm("将导入 "+n+" 套房、"+pn+" 张照片，覆盖当前手机上的全部记录。\n\n确定继续？（当前数据会被替换）")) return;
      var st = obj.data;
      state.flats = st.flats;
      state.settings = defSettings();
      if(st.settings){
        if(Number(st.settings.budget)>0) state.settings.budget = Math.round(Number(st.settings.budget));
        if(st.settings.weights) WKEYS.forEach(function(k){
          if(Number(st.settings.weights[k])>=0) state.settings.weights[k] = Number(st.settings.weights[k])||0;
        });
      }
      save();
      var jobs = (obj.pics||[]).map(function(p){
        try{ return photoPut(p.id, p.flatId, dataURLToBlob(p.data)); }catch(e){ return Promise.resolve(); }
      });
      Promise.all(jobs).then(function(){
        Object.keys(photoURLCache).forEach(function(k){ try{URL.revokeObjectURL(photoURLCache[k]);}catch(e){} delete photoURLCache[k]; });
        go("#list"); render(); toast("已恢复 "+n+" 套房、"+pn+" 张照片");
      });
    };
    fr.onerror = function(){ toast("读取文件失败"); };
    fr.readAsText(file);
  }

  var coMap = null;
  function renderCompanyMap(){
    var box = $("#companyMap");
    if(!box) return;
    var mk = [];
    if(state.settings.company) mk.push({lng:state.settings.company.lng, lat:state.settings.company.lat, label:"司", kind:"company", zIndex:300});
    drawMap(box, {
      center: state.settings.company ? [state.settings.company.lng, state.settings.company.lat] : null,
      zoom: 15, markers: mk,
      onPick: function(lng, lat, map){
        state.settings.company = {lng:lng, lat:lat};
        save();
        var h = $("#coHint");
        if(h) h.textContent = "已标点："+lng.toFixed(5)+", "+lat.toFixed(5);
        coMap = map;
        renderCompanyMap();
        toast("公司位置已保存");
      }
    });
    var lb = $("#coLocBtn");
    if(lb) lb.onclick=function(){
      locateMe(function(lng, lat){
        state.settings.company = {lng:lng, lat:lat}; save();
        if(coMap) coMap.setCenter([lng, lat]);
        renderCompanyMap(); toast("已用当前位置标公司");
      }, function(msg){ toast(msg); });
    };
    var sb = $("#coSearchBtn");
    if(sb) sb.onclick=function(){
      var kw = prompt("搜索公司/地点名称：", "");
      if(!kw || !kw.trim()) return;
      loadAMap().then(function(AMap){
        AMap.plugin("AMap.PlaceSearch", function(){
          var ps = new AMap.PlaceSearch({city:CITY, pageSize:1, citylimit:true});
          ps.search(kw.trim(), function(status, result){
            var poi = result && result.poiList && result.poiList.pois && result.poiList.pois[0];
            if(status==="complete" && poi && poi.location){
              var lng = poi.location.getLng(), lat = poi.location.getLat();
              state.settings.company = {lng:lng, lat:lat}; save();
              if(coMap) coMap.setCenter([lng, lat]);
              renderCompanyMap();
              toast("已定位到："+poi.name);
            }else{ toast("没搜到，换个关键词或直接点地图"); }
          });
        });
      }).catch(function(){ toast("地图没加载出来，请检查网络"); });
    };
  }

                return (da==null?1e9:da)-(db==null?1e9:db);
              }).map(function(f){

                return '<div class="row"><span>'+(esc(f.title)||esc(f.village)||"未命名")+' <span class="mono">'+r.score+'分</span></span><span class="v mono">'+(d==null?"—":fmtDist(d))+'</span></div>';
              }).join("")
            + '</div></div>' : '')

          + '</div>'
          + '<div class="box-body">'
          +   '<div class="flat-title"><span class="flat-name" data-rename="'+f.id+'">'+nameHtml+PEN+'</span><span class="label '+gradeLabel(r.score)+'">'+grade(r.score)+'</span>'
          +     (f.status? '<span class="label '+ST_CLASS[f.status]+'">'+ST_LABEL[f.status]+'</span>':'')
          +     (f.demo? '<span class="label lb-demo">示例</span>':'')
          +   '</div>'
          +   (meta.length? '<div class="meta">'+meta.join(" · ")+'</div>':'')
          +   (f.title&&f.addr? '<div class="meta" style="color:var(--faint);">'+esc(f.addr)+'</div>':'')
          +   ((f.photos&&f.photos.length)? '<div class="photo-strip" data-flat="'+f.id+'"></div>':'')
          +   '<div class="segbar">'+ segs.map(function(s){
                return '<span style="width:'+Math.max(0,Math.min(100,s.v)).toFixed(1)+'%;background:'+s.color+'" title="'+s.name+' '+s.v.toFixed(1)+' / '+s.max+'"></span>';
              }).join("") + '</div>'
          +   '<div class="legend">'+ segs.map(function(s){
                return '<span class="lg"><span class="dot" style="background:'+s.color+'"></span>'+s.name+'<span class="val mono">'+s.v.toFixed(0)+'<em>/'+s.max+'</em></span></span>';
              }).join("") + '</div>'
          +   (r.warnings.length? '<div class="warns">'+ r.warnings.map(function(w){return '<span class="label lb-'+WLB[w[0]]+'">'+w[1]+'</span>';}).join("") +'</div>' : '')
          + '</div>'
          + '<div class="box-foot">'
          +   '<span class="cost mono '+(r.budgetOver?'over':'in')+'">月租 ¥'+(f.rent||0)+'</span>'
          +   '<span class="cost2 mono">预估月总成本 ¥'+r.monthCost+'（含水电）</span>'
          +   (Number(f.rent)>0? '<span class="cost2 mono">首月需付 ¥'+firstCost(f).total+'（押'+ (Number(f.deposit)||1) +'付一'+(firstCost(f).broker?"+中介":"") +'）</span>':'')
          +   '<span class="cost2">硬件 '+r.got+'/'+r.total+'</span>'
          +   '<div class="acts">'
          +     '<select class="status-sel" data-status="'+f.id+'">'+ STATUSES.map(function(s){
                return '<option value="'+s[0]+'" '+((f.status||"")===s[0]?"selected":"")+'>'+s[1]+'</option>';
              }).join("") +'</select>'
          +     '<button class="btn btn-sm" data-edit="'+f.id+'">编辑</button>'
          +     '<button class="btn btn-sm" data-copy="'+f.id+'">复制摘要</button>'
          +     '<button class="btn btn-sm btn-danger" data-del="'+f.id+'">删除</button>'
          +   '</div>'
          + '</div></div>';
      });
      html += '<div class="foot">评分与数据只保存在本机浏览器（localStorage）<br>换手机或清除浏览器数据不会同步</div>';
    }
    app.innerHTML = html;
    $("#addBtn").onclick = function(){ go("#edit"); };
    var add2=$("#addBtn2"); if(add2) add2.onclick = function(){ go("#edit"); };
    app.querySelectorAll("[data-edit]").forEach(function(b){ b.onclick=function(){ go("#edit?id="+this.getAttribute("data-edit")); }; });
    app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){
      var id=this.getAttribute("data-del");
      if(confirm("确定删除这套看房记录？")){
        var victim=state.flats.filter(function(x){return x.id===id;})[0];
        if(victim&&victim.photos&&victim.photos.length) photoDel(victim.photos);
        state.flats = state.flats.filter(function(x){return x.id!==id;}); save(); render(); toast("已删除");
      }
    };});
    app.querySelectorAll("[data-copy]").forEach(function(b){ b.onclick=function(){
      var f = state.flats.filter(function(x){return x.id===this.getAttribute("data-copy");}.bind(this))[0];
      if(f){ copySummary(f); }
    };});
    app.querySelectorAll("[data-rename]").forEach(function(el){ el.onclick=function(){
      var id=this.getAttribute("data-rename");
      var f = state.flats.filter(function(x){return x.id===id;})[0];
      if(!f) return;
      var name = prompt("改个自己好认的房名（留空则显示村名+门牌）：", f.title||"");
      if(name===null) return;
      f.title = name.trim(); save(); render();
      if(f.title) toast("已改名："+f.title);
    };});

    /* 评分设置绑定 */
    var sb=$("#settingsBox");
    if(sb){
      sb.open = settingsOpen;
      sb.addEventListener("toggle",function(){ settingsOpen = this.open; });
    }
    function afterSet(){ save(); rerenderList(); toast("评分设置已生效"); }
    var bi=$("#setBudget");
    if(bi) bi.onchange=function(){
      var v=Math.max(0,Math.round(Number(this.value)||0));
      state.settings.budget = v>0 ? v : 700;
      afterSet();
    };
    var wg=$("#wGrid");
    if(wg) wg.querySelectorAll("[data-w]").forEach(function(inp){
      inp.onchange=function(){
        var w={};
        wg.querySelectorAll("[data-w]").forEach(function(x){ w[x.getAttribute("data-w")]=Math.max(0,Math.min(100,Number(x.value)||0)); });
        state.settings.weights = normalizeW(w);
        afterSet();
      };
    });
    app.querySelectorAll("[data-preset]").forEach(function(btn){
      btn.onclick=function(){
        state.settings.weights = Object.assign({},PRESETS[Number(this.getAttribute("data-preset"))][1]);
        afterSet();
      };
    });
    var wr=$("#wReset");
    if(wr) wr.onclick=function(){
      state.settings.weights = Object.assign({},DEFAULT_W);
      state.settings.budget = 700;
      afterSet();
    };

    /* 状态筛选 */
    app.querySelectorAll("[data-filter]").forEach(function(b){
      b.onclick=function(){ listFilter = this.getAttribute("data-filter"); rerenderList(); };
    });
    /* 列表 / 地图 切换 */
    app.querySelectorAll("[data-view]").forEach(function(b){
      b.onclick=function(){ listView = this.getAttribute("data-view"); rerenderList(); };
    });
    /* 地图视图渲染 */
    var lm = $("#listMap");
    if(lm){
      var mk = [];
      if(state.settings.company) mk.push({lng:state.settings.company.lng, lat:state.settings.company.lat, label:"司", kind:"company", zIndex:300, info:'<div class="amap-info-content"><b>公司</b></div>'});
      var ordered = flats.slice().sort(function(a,b){return calc(b).score-calc(a).score;});
      ordered.forEach(function(f, i){
        if(!f.loc || f.loc.lng==null) return;
        var r = calc(f);
        var d = distance(f.loc, state.settings.company);
        mk.push({
          lng:f.loc.lng, lat:f.loc.lat, label:String(i+1),
          info:'<div class="amap-info-content"><b>'+(esc(f.title)||esc(f.village)||"未命名")+'</b>'
             + '<div class="r">综合 '+r.score+' 分 · '+grade(r.score)+'</div>'
             + '<div class="r">月租 ¥'+(f.rent||0)+' · 首月 ¥'+firstCost(f).total+'</div>'
             + (f.commuteMin? '<div class="r">'+(f.commuteMode||"骑车")+' '+(f.commuteMin)+' 分钟</div>':'')
             + (d!=null? '<div class="r">距公司 '+fmtDist(d)+'（直线）</div>':'')
             + (state.settings.company? '<div class="r" style="margin-top:5px;color:#0969da;font-weight:600;">↓ 已在地图上画出到公司的路线</div>':'')
             + '</div>',
          onClick: state.settings.company ? function(m, map){
            var mode = f.commuteMode || "骑车";
            toast("正在算"+mode+"路线…");
            drawRoute(map, state.settings.company, f.loc, mode, function(mins, dist){
              toast((f.title||f.village||"该房")+"：导航 "+mins+" 分钟"+(dist? "，"+fmtDist(dist):""));
            }, function(msg){ toast(msg); });
          } : null
        });
      });
      var listMapInst = null;
      drawMap(lm, {markers:mk, zoom: mapped.length? 13 : 12, onReady:function(map){ listMapInst = map; }});
      var crb = $("#clearRouteBtn");
      if(crb) crb.onclick=function(){ if(listMapInst){ clearRoute(listMapInst); toast("已清除路线"); } };
    }
    /* 评分设置里的公司位置 */
    var cmb = $("#companyMap");
    if(cmb) renderCompanyMap();
    /* 状态标记下拉 */
    app.querySelectorAll("[data-status]").forEach(function(sel){
      sel.onchange=function(){
        var id=this.getAttribute("data-status");
        var f=state.flats.filter(function(x){return x.id===id;})[0];
        if(!f) return;
        f.status = this.value; save(); rerenderList();
        if(f.status) toast("已标记："+ST_LABEL[f.status]);
      };
    });
    /* 备份 / 恢复 */
    var eb=$("#exportBtn"); if(eb) eb.onclick=exportBackup;
    /* 示例清空 / 重载 */
    var cdb=$("#clearDemoBtn"); if(cdb) cdb.onclick=function(){
      if(confirm("清空这 4 套示例？你自己的记录不受影响。")) clearDemo();
    };
    var rdb=$("#reloadDemoBtn"); if(rdb) rdb.onclick=function(){ reloadDemo(); };
    var ib=$("#importBtn"), ii=$("#importInput");
    if(ib && ii){
      ib.onclick=function(){ ii.click(); };
      ii.onchange=function(){
        var file=this.files && this.files[0]; this.value="";
        if(file) importBackup(file);
      };
    }

    hydrateListPhotos(app);
  }

  function summaryText(f){
    var r=calc(f);
    var L=[];
    L.push("【看房记录】"+(f.title||f.village||"未命名")+(f.title&&f.village?"（"+f.village+"）":"")+" "+(f.addr||""));
    L.push(f.htype+" "+(f.area?f.area+"㎡ ":"")+(f.floor?f.floor+"/"+f.totalFloor+"层":"")+(f.lift?" 电梯":" 步梯")+" "+(f.commuteMode||"骑车")+(f.commuteMin||"?")+"分钟");
    L.push("月租"+f.rent+"元 | 电"+(f.ePrice||"?")+"元/度 水"+(f.wPrice||"?")+"元/吨 | 预估月总成本"+r.monthCost+"元");
    L.push("硬件齐全 "+r.got+"/"+r.total+" | 综合评分 "+r.score+"（"+grade(r.score)+"）");
    if(f.phone) L.push("房东电话："+f.phone);
    if(f.note) L.push("备注："+f.note);
    return L.join("\n");
  }
  function copySummary(f){
    var txt=summaryText(f);
    function ok(){toast("摘要已复制，可粘贴到微信");};
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,function(){fallback();}); }
    else fallback();
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy");ok();}catch(e){toast("复制失败，请截图记录");} document.body.removeChild(ta);
    }
  }

  /* ================= 视图：编辑 ================= */
  var editing = null, editIsNew = false;
  function isBlank(f){
    return !f.title && !f.village && !f.rent && !f.phone && !f.addr && !f.note && !(f.photos&&f.photos.length)
      && SUBJECTS.every(function(s){return !Number(f.scores[s[0]]);})
      && FEATURES.every(function(x){return !f.features[x[0]];})
      && RISKS.every(function(x){return !f.risks[x[0]];});
  }
  function dropIfBlankNew(){
    if(editIsNew && editing && isBlank(editing)){
      state.flats = state.flats.filter(function(x){return x.id!==editing.id;}); save();
    }
  }
  function renderEdit(id){
    editing = id ? state.flats.filter(function(f){return f.id===id;})[0] : blankFlat();
    if(id && !editing){ go("#list"); return; }
    editIsNew = !id;
    lastRoute = null;
    if(editIsNew){ state.flats.push(editing); save(); }
    var headName = id ? ("编辑："+(esc(editing.title)||(esc(editing.village)+esc(editing.addr))||"看房记录")) : "新增看房记录";
    var app=$("#app");
    app.innerHTML =
      '<header class="gh-top"><div class="gh-top-in">'
      + '<button class="btn btn-dark" id="backBtn">‹ 返回对比</button>'
      + '<div class="edit-title">'+headName+'</div>'
      + '<button class="btn btn-primary" id="saveTop">保存</button>'
      + '</div></header>'
      + '<div class="edit-grid"><div class="edit-main" id="editMain"></div><div class="live-panel" id="livePanel"></div></div>'
      + (editing && editing.demo ? '<div class="demo-bar" style="margin-top:12px;"><span class="t">这是<b>示例数据</b>，可以随便改着玩；确认看懂后回列表点「清空示例」即可。</span></div>' : '');

    $("#editMain").innerHTML = formHTML(editing);
    bindForm();
    renderLive();
    bindPhotoInput();
    renderPhotoGrid();
    renderEditMap();
    $("#backBtn").onclick=function(){ dropIfBlankNew(); go("#list"); };
    $("#saveTop").onclick=function(){
      if(editIsNew && isBlank(editing)){ dropIfBlankNew(); toast("内容为空，未保存"); go("#list"); return; }
      save(); toast("已保存"); go("#list");
    };
  }

    var h = '';

      + '<div class="field"><label>街巷门牌（选填）</label><input data-k="addr" value="'+esc(f.addr)+'" placeholder="如：西便村X巷X号"></div>'
      + '<div class="field"><label>房东电话（选填）</label><input type="tel" data-k="phone" value="'+esc(f.phone)+'" placeholder="选填，方便回头联系"></div>'
      + '<div class="field"><label>户型</label><select data-k="htype">'+HTYPES.map(function(x){return '<option '+(f.htype===x?"selected":"")+'>'+x+'</option>';}).join("")+'</select></div>'
      + numField("area","面积","㎡")
      + numField("floor","所在楼层","楼")
      + numField("totalFloor","总楼层","层")
      + '<div class="field"><label>楼型</label><select data-k="lift"><option value="false" '+(f.lift?"":"selected")+'>步梯</option><option value="true" '+(f.lift?"selected":"")+'>电梯</option></select></div>'
      + '<div class="field"><label>朝向</label><select data-k="orient">'+ORIENTS.map(function(x){return '<option '+(f.orient===x?"selected":"")+'>'+x+'</option>';}).join("")+'</select></div>'

            return '<option value="'+s[0]+'" '+((f.status||"")===s[0]?"selected":"")+'>'+s[1]+'</option>';
          }).join("") +'</select></div>'
      + '</div></div></section>';

    /* 位置打点 */
    h += '<section class="box panel"><div class="box-head"><span>位置</span><span class="hint" id="locHint">'+(f.loc? (f.loc.lng.toFixed(5)+", "+f.loc.lat.toFixed(5)) : "未标点")+'</span></div>'

      +   '</div>'
      +   (f.loc&&state.settings.company? '<div class="map-actions">'
      +     '<button type="button" class="btn btn-sm btn-primary" id="routeBtn">🚏 显示到公司路线（'+(f.commuteMode||"骑车")+'）</button>'
      +     '<button type="button" class="btn btn-sm" id="applyRouteBtn" style="display:none;">✓ 用路线时间修正通勤</button>'
      +     '<button type="button" class="btn btn-sm" id="hideRouteBtn">隐藏路线</button>'
      +   '</div>':'')
      +   '<div class="map-tip">点地图直接标位置；到公司直线距离：<b id="locDist">'+(f.loc&&state.settings.company? fmtDist(distance(f.loc, state.settings.company)) : "先在「评分设置」里标公司位置")+'</b><span id="routeInfo"></span></div>'
      + '</div></section>';

    /* 现场照片 */

    /* 费用 */
    h += '<section class="box panel"><div class="box-head"><span>费用明细</span><span class="hint">逐项写死，口头不算</span></div><div class="box-body"><div class="fgrid">'
      + numField("rent","月租 *","元")
      + '<div class="field"><label>押金（月数）</label><select data-k="deposit">'+[1,2,3].map(function(n){return '<option value="'+n+'" '+(Number(f.deposit)===n?"selected":"")+'>押'+n+'</option>';}).join("")+'</select></div>'

      + numField("ePrice","电费单价","元/度")
      + numField("wPrice","水费单价","元/吨")
      + numField("eKwh","预估月用电","度")

      + '</div><div class="fieldnote">佛山居民一档电价约 0.59 元/度；城中村常见加价到 1.3–1.5，水费常见 5 元/吨。预估用电默认 120 度（常开空调可调到 180–220）。</div></div></section>';

    /* 硬件 */
    h += '<section class="box panel"><div class="box-head"><span>屋内硬件</span><span class="hint">现场逐项点选，已勾选 '+FEATURES.filter(function(x){return f.features[x[0]];}).length+'/'+FEATURES.length+'</span></div>'
      + '<div class="box-body"><div class="chips" id="featChips">'+ FEATURES.map(function(x){
          return '<button type="button" class="chip'+(f.features[x[0]]?" on":"")+'" data-feat="'+x[0]+'"><span class="tick">✓</span>'+x[1]+'</button>';
        }).join("") +'</div></div></section>';

    /* 风险 */
    h += '<section class="box panel"><div class="box-head"><span>风险红线</span><span class="hint">命中就点，自动扣分</span></div>'
      + '<div class="box-body"><div class="chips">'+ RISKS.map(function(x){
          return '<button type="button" class="chip risk'+(f.risks[x[0]]?" on":"")+'" data-risk="'+x[0]+'"><span class="tick">!</span>'+x[1]+'</button>';
        }).join("") +'</div></div></section>';

    /* 主观评分 */
    h += '<section class="box panel"><div class="box-head"><span>主观印象</span><span class="hint">凭现场感觉，1 差 — 5 好</span></div><div class="box-body"><div class="stars">'
      + SUBJECTS.map(function(s){
          return '<div class="star-row"><span class="sl">'+s[1]+'</span><div class="seg" data-score="'+s[0]+'">'
            + [1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" class="'+(Number(f.scores[s[0]])===n?"on":"")+'">'+n+'</button>';}).join("")
            + '</div></div>';
        }).join("")
      + '</div></div></section>';

    /* 备注 */
    h += '<section class="box panel"><div class="box-head"><span>备注</span></div><div class="box-body"><div class="field"><textarea data-k="note" placeholder="砍价空间、顾虑、房东原话、约定复看时间……">'+esc(f.note)+'</textarea></div></div></section>';

    h += '<div class="save-bar"><button class="btn btn-primary block" id="saveBottom">保存并返回对比</button>'
      + (editing&&(editing.village||editing.title)? '<button class="btn" id="copyBtn">复制本套摘要</button>':'')+'</div>';
    return h;
  }

  function bindForm(){
    var main=$("#editMain");
    main.addEventListener("input", onInput);
    main.addEventListener("change", onInput);
    main.addEventListener("click", function(e){
      var chip = e.target.closest("[data-feat],[data-risk],[data-score] button");
      if(!chip) return;
      if(chip.hasAttribute("data-feat")){
        var k=chip.getAttribute("data-feat"); editing.features[k]=!editing.features[k]; chip.classList.toggle("on");
        var got=FEATURES.filter(function(x){return editing.features[x[0]];}).length;
        var hint=chip.closest(".panel").querySelector(".hint");
        if(hint){ hint.textContent="现场逐项点选，已勾选 "+got+"/"+FEATURES.length; }
        refreshAfterChange();
      }else if(chip.hasAttribute("data-risk")){
        var rk=chip.getAttribute("data-risk"); editing.risks[rk]=!editing.risks[rk]; chip.classList.toggle("on"); refreshAfterChange();
      }else if(chip.parentNode.hasAttribute("data-score")){
        var sk=chip.parentNode.getAttribute("data-score"), n=Number(chip.getAttribute("data-n"));
        editing.scores[sk]=n;
        chip.parentNode.querySelectorAll("button").forEach(function(b){b.classList.toggle("on", Number(b.getAttribute("data-n"))===n);});
        refreshAfterChange();
      }
    });
    function onInput(e){
      var el=e.target; if(!el.hasAttribute("data-k")) return;
      var k=el.getAttribute("data-k");
      if(k==="lift"){ editing.lift = el.value==="true"; }
      else editing[k]=el.value;
      refreshAfterChange();
    }
    function refreshAfterChange(){ save(); renderLive(); }
    var sb=$("#saveBottom"); if(sb) sb.onclick=function(){
      if(editIsNew && isBlank(editing)){ dropIfBlankNew(); toast("内容为空，未保存"); go("#list"); return; }
      save(); toast("已保存"); go("#list");
    };
    var cb=$("#copyBtn"); if(cb) cb.onclick=function(){ copySummary(editing); };
  }

  /* ================= 编辑页地图 ================= */
  var editMap = null, editAMap = null, lastRoute = null;
  function setLoc(lng, lat){
    editing.loc = {lng:lng, lat:lat};
    save();
    var hint = $("#locHint");
    if(hint) hint.textContent = lng.toFixed(5)+", "+lat.toFixed(5);
    var dEl = $("#locDist");
    if(dEl) dEl.textContent = state.settings.company ? fmtDist(distance(editing.loc, state.settings.company)) : "先在「评分设置」里标公司位置";
  }
  function renderEditMap(){
    var box = $("#editMap");
    if(!box) return;
    if(editMap){ try{ editMap.destroy(); }catch(e){} editMap = null; }
    var markers = [];
    if(editing.loc) markers.push({lng:editing.loc.lng, lat:editing.loc.lat, label:"房", kind:"pick", zIndex:200});
    if(state.settings.company) markers.push({lng:state.settings.company.lng, lat:state.settings.company.lat, label:"司", kind:"company"});
    drawMap(box, {
      center: editing.loc ? [editing.loc.lng, editing.loc.lat] : null,
      zoom: 16,
      markers: markers,
      onReady: function(map){ editMap = map; },
      onPick: function(lng, lat, map){
        setLoc(lng, lat);
        renderEditMap();
      }
    });
    var mb = $("#locMeBtn");
    if(mb) mb.onclick=function(){
      locateMe(function(lng, lat){
        setLoc(lng, lat);
        if(editMap) editMap.setCenter([lng, lat]);
        renderEditMap();
        toast("已用当前位置标点");
      }, function(msg){ toast(msg); });
    };
    var sb = $("#locSearchBtn");
    if(sb) sb.onclick=function(){
      var kw = prompt("搜索地点（村名/路名/小区）：", (editing.village||"")+(editing.addr||""));
      if(!kw || !kw.trim()) return;
      loadAMap().then(function(AMap){
        AMap.plugin("AMap.PlaceSearch", function(){
          var ps = new AMap.PlaceSearch({city:CITY, pageSize:1, citylimit:true});
          ps.search(kw.trim(), function(status, result){
            var poi = result && result.poiList && result.poiList.pois && result.poiList.pois[0];
            if(status==="complete" && poi && poi.location){
              var lng = poi.location.getLng(), lat = poi.location.getLat();
              setLoc(lng, lat);
              if(editMap) editMap.setCenter([lng, lat]);
              renderEditMap();
              toast("已定位到："+poi.name);
            }else{
              toast("没搜到，换个关键词或直接点地图");
            }
          });
        });
      }).catch(function(){ toast("地图没加载出来，请检查网络"); });
    };
    var cb = $("#locClearBtn");
    if(cb) cb.onclick=function(){ editing.loc = null; save(); renderEditMap(); toast("已清除标点"); };

    /* 路线轨迹 + 修正通勤 */
    var rb = $("#routeBtn");
    if(rb) rb.onclick=function(){
      var mode = editing.commuteMode || "骑车";
      var fire = function(map){
        toast("正在算"+mode+"路线…");
        drawRoute(map, state.settings.company, editing.loc, mode, function(mins, dist){
          lastRoute = {mins:mins, dist:dist, mode:mode};
          var ri = $("#routeInfo");
          if(ri) ri.innerHTML = ' · 导航 <b>'+mins+' 分钟</b>'+(dist? '（'+fmtDist(dist)+'）':'');
          var ab2 = $("#applyRouteBtn");
          if(ab2) ab2.style.display = "";
          toast("路线已显示：" + mins + " 分钟");
        }, function(msg){ toast(msg); });
      };
      if(editMap){ fire(editMap); return; }
      /* 地图还在加载：等它就绪 */
      var waited = 0;
      var iv = setInterval(function(){
        waited += 300;
        if(editMap){ clearInterval(iv); fire(editMap); }
        else if(waited > 8000){ clearInterval(iv); toast("地图加载超时，请检查网络后重试"); }
      }, 300);
    };
    var hb = $("#hideRouteBtn");
    if(hb) hb.onclick=function(){
      if(editMap) clearRoute(editMap);
      lastRoute = null;
      var ri = $("#routeInfo"); if(ri) ri.textContent = "";
      toast("已隐藏路线");
    };
    var ab = $("#applyRouteBtn");
    if(ab) ab.onclick=function(){
      if(!lastRoute){ toast("先点「显示到公司路线」算出时间"); return; }
      editing.commuteMin = String(lastRoute.mins);
      var inp = document.querySelector('[data-k="commuteMin"]');
      if(inp) inp.value = lastRoute.mins;
      save(); renderLive();
      toast("通勤时间已修正为 " + lastRoute.mins + " 分钟（"+lastRoute.mode+"）");
    };
  }
  /* ================= 编辑页照片管理 ================= */
  function bindPhotoInput(){
    var inp = $("#photoInput");
    if(!inp) return;
    inp.onchange = function(){
      var files = Array.prototype.slice.call(this.files || []);
      this.value = "";
      if(!files.length) return;
      var ids = photoIds(editing);
      var slots = MAXPHOTOS - ids.length;
      if(slots <= 0){ toast("每套最多 9 张"); return; }
      if(files.length > slots){ files = files.slice(0, slots); toast("最多还能添加 "+slots+" 张，已截取前 "+slots+" 张"); }
      toast("正在处理照片…");
      Promise.all(files.map(function(f){
        return compressImage(f).then(function(blob){
          var pid = "p" + Date.now().toString(36) + Math.floor(Math.random()*9999);
          return photoPut(pid, editing.id, blob).then(function(){ ids.push(pid); });
        });
      })).then(function(){
        save(); renderPhotoGrid();
        toast("照片已保存");
      }).catch(function(){ toast("照片保存失败，请重试"); });
    };
  }
  function renderPhotoGrid(){
    var grid = $("#photoGrid"), cnt = $("#photoCount"), inp = $("#photoInput");
    if(!grid) return;
    var ids = photoIds(editing);
    grid.innerHTML = "";
    ids.forEach(function(id, ix){
      var d = document.createElement("div"); d.className = "ph";
      var im = new Image(); im.alt = "照片"+(ix+1);
      im.onclick = function(){ openLightbox(ids, ix); };
      d.appendChild(im);
      var del = document.createElement("button");
      del.type = "button"; del.className = "ph-del"; del.textContent = "✕"; del.setAttribute("aria-label","删除这张照片");
      del.onclick = function(){
        if(!confirm("删除这张照片？")) return;
        ids.splice(ix,1); save(); photoDel([id]); renderPhotoGrid(); toast("已删除");
      };
      d.appendChild(del);
      grid.appendChild(d);
      photoURL(id).then(function(u){ if(u) im.src = u; else d.remove(); });
    });
    if(cnt) cnt.textContent = ids.length+"/"+MAXPHOTOS;
    if(ids.length < MAXPHOTOS && inp){
      var t = document.createElement("button");
      t.type = "button"; t.className = "ph ph-add";
      t.innerHTML = '<span class="plus">＋</span><span>拍照/相册</span>';
      t.onclick = function(){ inp.click(); };
      grid.appendChild(t);
    }
  }

  function renderLive(){
    var f=editing, r=calc(f), B=state.settings.budget;
    var panel=$("#livePanel");
    var costRows=[
      ["月租",(Number(f.rent)||0)+" 元"],
      ["预估电费",((Number(f.ePrice)||0)*(Number(f.eKwh)||0)).toFixed(0)+" 元（"+(f.ePrice||0)+"×"+(f.eKwh||0)+"度）"],
      ["预估水费",((Number(f.wPrice)||0)*(Number(f.wTon)||0)).toFixed(0)+" 元"],
      ["公摊+网费",((Number(f.sharedFee)||0)+(Number(f.netFee)||0))+" 元"]
    ];
    var segs = segParts(r);
    var fc = firstCost(f);
    panel.innerHTML =
      '<div class="box score-box"><div class="score-line"><span class="n mono" style="color:'+gradeColor(r.score)+'">'+r.score+'</span><span class="of mono">/ 100</span></div>'
      + '<div class="g"><span class="label '+gradeLabel(r.score)+'">'+grade(r.score)+'</span>'
      +   (f.status? ' <span class="label '+ST_CLASS[f.status]+'">'+ST_LABEL[f.status]+'</span>':'')
      + '</div>'
      + '<div class="progress"><span style="width:'+r.score+'%;background:'+gradeColor(r.score)+';"></span></div></div>'
      + '<div class="box"><div class="box-head"><span>费用预估</span></div><div class="box-body costrows">'
      +   costRows.map(function(x){return '<div class="row"><span>'+x[0]+'</span><span class="v mono">'+x[1]+'</span></div>';}).join("")
      +   '<div class="row total"><span>预估月总成本</span><span class="v mono">¥ '+r.monthCost+'</span></div>'
      +   '<div class="flash '+(r.budgetOver?"over":"in")+'">'+(Number(f.rent)>0 ? (r.budgetOver? "月租已超 "+B+" 元预算":"月租在 "+B+" 元预算内"):"填了月租后判定预算")+'</div>'
      + '</div></div>'
      + '<div class="box"><div class="box-head"><span>首月需付</span><span class="hint">押'+(Number(f.deposit)||1)+'付一'+(fc.broker?"+中介":"")+'</span></div><div class="box-body costrows">'
      +   '<div class="row"><span>首月租金</span><span class="v mono">'+(fc.rent||0)+' 元</span></div>'
      +   '<div class="row"><span>押金（'+(Number(f.deposit)||1)+' 个月）</span><span class="v mono">'+fc.deposit+' 元</span></div>'
      +   (fc.broker? '<div class="row"><span>中介费</span><span class="v mono">'+fc.broker+' 元</span></div>':'')
      +   '<div class="row total"><span>入住首月一次性支出</span><span class="v mono">¥ '+fc.total+'</span></div>'
      + '</div></div>'
      + '<div class="box"><div class="box-head"><span>得分构成</span><span class="hint">满分 100</span></div><div class="box-body">'
      +   '<div class="segbar" style="margin-top:2px;">'+ segs.map(function(s){
            return '<span style="width:'+Math.max(0,Math.min(100,s.v)).toFixed(1)+'%;background:'+s.color+'" title="'+s.name+' '+s.v.toFixed(1)+' / '+s.max+'"></span>';
          }).join("") + '</div>'
      +   '<div class="legend">'+ segs.map(function(s){
            return '<span class="lg"><span class="dot" style="background:'+s.color+'"></span>'+s.name+'<span class="val mono">'+s.v.toFixed(1)+'<em>/'+s.max+'</em></span></span>';
          }).join("") + '</div>'
      +   (r.parts.risk>0?'<div class="riskline">风险已扣 −'+r.parts.risk+' 分</div>':'')
      + '</div></div>'
      + '<div class="box"><div class="box-head"><span>实时提示</span></div><div class="box-body"><div class="live-warn">'+ r.warnings.map(function(w){return '<span class="label lb-'+WLB[w[0]]+'">'+w[1]+'</span>';}).join("") +'</div></div></div>';
  }

  /* ================= 示例数据 ================= */
  var demoLoaded = false;
  function injectDemo(){
    if(demoLoaded) return;
    demoLoaded = true;
    state.flats = demoFlats().concat(state.flats);
    /* 给示例配一个公司位置，这样地图和距离一进去就能看到效果 */
    if(!state.settings.company) state.settings.company = {lng:113.1225, lat:23.0215};
    save();
  }
  function hasDemo(){ return state.flats.some(function(f){return f.demo;}); }
  /* 从存储重新同步内存状态，避免多标签页/外部改动造成覆盖 */
  function syncFromStore(){
    try{
      var raw2 = localStorage.getItem(STORE_KEY);
      if(!raw2) return;
      var s2 = JSON.parse(raw2);
      if(s2 && Array.isArray(s2.flats)) state.flats = s2.flats;
      if(s2 && s2.settings && s2.settings.company && s2.settings.company.lng!=null) state.settings.company = s2.settings.company;
    }catch(e){}
  }
  function clearDemo(){
    syncFromStore();
    state.flats = state.flats.filter(function(f){return !f.demo;});
    save(); render(); toast("已清空示例，可以开始记录自己的房子了");
  }
  function reloadDemo(){
    syncFromStore();
    state.flats = state.flats.filter(function(f){return !f.demo;});
    demoLoaded = false; injectDemo(); render();
    toast("示例已重新载入");
  }

  /* ================= 启动 ================= */
  function render(){
    var rt=currentRoute();
    if(rt.view==="edit"){ renderEdit(rt.id); } else { renderList(); }
    window.scrollTo(0,0);
  }
  if(firstVisit) injectDemo();
  render();

  /* 照片灯箱（全局只绑一次） */
  $("#lbClose").onclick = closeLightbox;
  $("#lbPrev").onclick = function(){ lbState.idx = (lbState.idx-1+lbState.ids.length)%lbState.ids.length; showLightbox(); };
  $("#lbNext").onclick = function(){ lbState.idx = (lbState.idx+1)%lbState.ids.length; showLightbox(); };
  $("#lightbox").addEventListener("click", function(e){ if(e.target===this) closeLightbox(); });
  document.addEventListener("keydown", function(e){
    if(!$("#lightbox").classList.contains("open")) return;
    if(e.key==="Escape") closeLightbox();
    else if(e.key==="ArrowLeft") $("#lbPrev").click();
    else if(e.key==="ArrowRight") $("#lbNext").click();
  });
})();
</script>
</body>
